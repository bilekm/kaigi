# Workflow Definition Schema
# Version: 1.0
#
# This file documents the expected structure of workflow YAML files.
# Used for validation in `orchestrator validate` command.

$schema: "http://json-schema.org/draft-07/schema#"
$id: "orchestrator-workflow-v1.0"
title: "Orchestrator Workflow Definition"
type: object

required:
  - name
  - version
  - steps

properties:
  name:
    type: string
    description: "Human-readable workflow name"
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9_-]{0,99}$"
    minLength: 1
    maxLength: 100

  version:
    type: string
    description: "Schema version (currently only '1.0' supported)"
    enum: ["1.0"]

  description:
    type: string
    description: "Optional workflow description"
    maxLength: 500

  steps:
    type: array
    description: "Ordered list of agent steps"
    minItems: 1
    items:
      $ref: "#/definitions/AgentStep"

definitions:
  AgentStep:
    type: object
    required:
      - id
      - command
    properties:
      id:
        type: string
        description: "Unique step identifier within workflow"
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9_-]{0,49}$"
        minLength: 1
        maxLength: 50

      command:
        type: string
        description: "Executable command or path"
        minLength: 1

      args:
        type: array
        description: "Command arguments"
        items:
          type: string

      timeout:
        type: integer
        description: "Timeout in seconds (default: 300)"
        minimum: 1
        maximum: 86400
        default: 300

      env:
        type: object
        description: "Additional environment variables"
        additionalProperties:
          type: string

# Example valid workflow:
#
# name: data-pipeline
# version: "1.0"
# description: "Fetch, transform, and store data"
# steps:
#   - id: fetch
#     command: curl
#     args: ["-s", "https://api.example.com/data"]
#     timeout: 60
#
#   - id: transform
#     command: jq
#     args: [".items[] | select(.active)"]
#
#   - id: store
#     command: ./store.sh
#     env:
#       OUTPUT_DIR: /data/results
