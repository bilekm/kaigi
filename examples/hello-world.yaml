# Simple hello world workflow
# Run with: orchestrator run examples/hello-world.yaml

name: hello-world
version: "1.0"
description: A simple workflow that demonstrates basic agent chaining
steps:
  - id: greet
    command: echo
    args: ["Hello from Orchestrator!"]

  - id: timestamp
    command: date
    args: ["+%Y-%m-%d %H:%M:%S"]
