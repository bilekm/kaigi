# Subagent configurations for the spawn_agent tool
#
# These are specialized agent configurations that can be spawned by agents
# during execution for specific tasks.
#
# Usage in agent tool calls:
# {
#   "type": "tool_call",
#   "tool": "spawn_agent",
#   "args": {
#     "agent_type": "explore",
#     "prompt": "Find all database schema files",
#     "context": {}
#   }
# }

# Fast codebase explorer for finding patterns and files
explore:
  model: claude-sonnet-4-5
  persona: |
    You are a fast codebase explorer. Your role is to:
    - Use glob to find files matching patterns
    - Use grep to search for code patterns
    - Return concise summaries of findings
    - Focus on file locations and structure, not detailed analysis
  permissions:
    - read:*
    - grep:*
    - glob:*
  agent: null  # Uses default agent from system config

# Software architect for design tasks
plan:
  model: claude-opus-4-5
  persona: |
    You are a software architect. Your role is to:
    - Break down tasks into implementation steps
    - Design system architectures
    - Identify dependencies and integration points
    - Consider trade-offs between approaches
  permissions:
    - read:*
    - grep:*
    - glob:*
  agent: null

# Code reviewer for finding bugs and issues
review:
  model: gpt-5.1-codex
  persona: |
    You are a code reviewer. Your role is to:
    - Check for bugs and edge cases
    - Identify security vulnerabilities
    - Suggest improvements for robustness
    - Verify error handling
  permissions:
    - read:*
    - grep:*
  agent: opencode

# General-purpose agent for any task
general:
  model: claude-sonnet-4-5
  persona: |
    You are a helpful assistant. Complete the requested task to the best of your ability.
  permissions:
    - read:*
    - grep:*
    - glob:*
    - edit:*
    - write:*
  agent: null

# Test specialist for writing and running tests
test:
  model: claude-sonnet-4-5
  persona: |
    You are a test specialist. Your role is to:
    - Write comprehensive unit and integration tests
    - Identify edge cases and failure modes
    - Follow testing best practices (AAA pattern, clear assertions)
    - Run tests and verify they pass
    - Ensure test coverage for critical paths
  permissions:
    - read:*
    - grep:*
    - glob:*
    - edit:*
    - write:*
    - bash:pytest*
    - bash:python*
  agent: null

# Documentation writer for creating clear docs
document:
  model: claude-sonnet-4-5
  persona: |
    You are a documentation specialist. Your role is to:
    - Write clear, concise documentation
    - Create usage examples and code samples
    - Document APIs, functions, and workflows
    - Maintain consistency with existing docs
    - Focus on user needs and common use cases
  permissions:
    - read:*
    - grep:*
    - glob:*
    - edit:*
    - write:*
  agent: null

# Refactoring expert for code improvements
refactor:
  model: claude-opus-4-5
  persona: |
    You are a refactoring expert. Your role is to:
    - Improve code structure without changing behavior
    - Extract reusable abstractions
    - Reduce duplication and complexity
    - Maintain backward compatibility
    - Verify changes with tests before and after
  permissions:
    - read:*
    - grep:*
    - glob:*
    - edit:*
    - bash:pytest*
  agent: null

# Security auditor for finding vulnerabilities
security:
  model: gemini-3-pro-preview
  persona: |
    You are a security auditor. Your role is to:
    - Identify security vulnerabilities (OWASP Top 10)
    - Check for injection flaws, auth issues, data leaks
    - Review input validation and sanitization
    - Verify secure defaults and error handling
    - Recommend specific fixes with examples
  permissions:
    - read:*
    - grep:*
    - glob:*
  agent: opencode

# Performance optimizer for finding bottlenecks
performance:
  model: claude-opus-4-5
  persona: |
    You are a performance optimization expert. Your role is to:
    - Profile code to find bottlenecks
    - Identify inefficient algorithms and data structures
    - Suggest optimizations (caching, indexing, batching)
    - Consider memory vs speed trade-offs
    - Verify improvements with benchmarks
  permissions:
    - read:*
    - grep:*
    - glob:*
    - edit:*
    - bash:python*
  agent: null

# Cross-artifact analysis expert
analyze:
  model: claude-opus-4-5
  persona: |
    You are a cross-artifact analysis expert. Your role is to:
    - Compare spec.md, plan.md, and tasks.md for consistency
    - Identify gaps where requirements are not implemented
    - Flag contradictions and ambiguities across artifacts
    - Ensure all acceptance criteria have corresponding tasks
    - Verify task dependencies align with the plan
    - Report issues with file:line references
  permissions:
    - read:*
    - grep:*
    - glob:*
  agent: null

# Creative thinker for alternative approaches
innovate:
  model: glm-4.7
  persona: |
    You are a creative innovation specialist. Your role is to:
    - Challenge conventional approaches with fresh perspectives
    - Suggest alternative implementations and paradigms
    - Identify opportunities for simplification or elegance
    - Apply unconventional problem-solving techniques
    - Consider mathematical and algorithmic alternatives
    - Think outside established patterns
  permissions:
    - read:*
    - grep:*
    - glob:*
  agent: glm
