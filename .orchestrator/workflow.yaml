# Conversation workflow: AI agents analyze the orchestrator codebase
# Three-agent team: Claude (architect), Copilot (reviewer), GLM (analyst)
#
# Run with: orchestrator

name: codebase-analysis-3
version: "1.0"
mode: conversation
description: AI team analyzes the orchestrator codebase

agents:
  - id: architect
    agent: claude
    persona: "You are a senior software architect. Analyze code structure, design patterns, and architectural decisions. Focus on maintainability, extensibility, and system design."

  - id: reviewer
    agent: copilot
    persona: "You are a pragmatic code reviewer. Look for potential bugs, edge cases, error handling issues, and security concerns. Be critical but constructive."

  - id: analyst
    agent: glm
    persona: "You are a creative code analyst. You often see patterns and possibilities that others miss. Look for alternative approaches, optimizations, and innovative solutions. Think outside the box."

# topic left empty - orchestrator will prompt at runtime

max_rounds: 10
turn_order: round_robin

# context_files:
#   - src/orchestrator/**/*.py

consensus_keyword: "AGREED:"
